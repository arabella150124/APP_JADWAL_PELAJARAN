<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ascTimetables | Jadwal KBM</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* Loading overlay sebelum iframe muat sempurna */
    #loader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    /* Frame tempat Apps Script dimuat */
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Loading Animation -->
  <div id="loader">
    <div class="spinner"></div>
    <p style="margin-top: 12px; color: #555; font-size: 14px;">Memuat aplikasi...</p>
  </div>

  <!-- Pembungkus Iframe GAS -->
  <iframe 
    id="gas-frame"
    src="https://script.google.com/macros/s/AKfycbykeTSHuPHldF-jyJbEqRz0h-OazfzJ5n9-spnNpAg4cpnV_DQCUAIhg95K-HLZWqXO/exec" 
    allow="geolocation; microphone; camera; clipboard-write;"
    onload="hideLoader()"
  ></iframe>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loader');
      loader.style.opacity = '0';
      setTimeout(() => {
        loader.style.display = 'none';
      }, 300);
    }
  </script>
</body>
</html>
