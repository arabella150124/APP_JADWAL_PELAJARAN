    <!-- STREAMING_CHUNK:Initializing application state and logic... -->
    <script>

        let modalActionType = '';

        let state = {

            competencies: [

            ],
            teachers: [
                { id: 'G01', code: 'J4', name: 'Bertolomeus Reba, S.Pd', nip: '197503122000031001', picketDays: ['Senin'], maxHours: 30 },
                { id: 'G02', code: 'K', name: 'Maria Elisabeth Bhiju, A.Md', nip: '198205142006042002', picketDays: ['Rabu'], maxHours: 32 },
                { id: 'G03', code: 'L', name: 'Egnisius Rawi, ST', nip: '197507042007011003', picketDays: ['Kamis'], maxHours: 28 },
                { id: 'G04', code: 'L1', name: 'Petrus Bhoko, S.Pd', nip: '199002152015032001', picketDays: ['Jumat'], maxHours: 34 },
                { id: 'G05', code: 'L2', name: 'Maria Crensiana Fono, S.Pd', nip: '198507082009021004', picketDays: ['Selasa'], maxHours: 30 }
            ],
            subjects: [
                { id: 'SEJ', code: 'SEJ', name: 'Sejarah', category: 'Umum', color: '#2563eb' },
                { id: 'PKKW', code: 'PKK', name: 'Produk Kreatif dan Kewirausahaan', category: 'Kejuruan', color: '#9333ea' },

                { id: 'X_DPIB', code: 'X DPIB', name: 'Kelas X DPIB', grade: 'X', maxWeeklyHours: 50 },
                { id: 'X_TKR_1', code: 'X TKR 1', name: 'Kelas X TKR 1', grade: 'X', maxWeeklyHours: 50 },
                { id: 'X_TKR_2', code: 'X TKR 2', name: 'Kelas X TKR 2', grade: 'X', maxWeeklyHours: 50 },
                { id: 'XII_DPIB', code: 'XII DPIB', name: 'Kelas XII DPIB', grade: 'XII', maxWeeklyHours: 48 },
                { id: 'XII_TKJ_1', code: 'XII TKJ 1', name: 'Kelas XII TKJ 1', grade: 'XII', maxWeeklyHours: 48 }
            ],
            assignments: [
                { id: 'ASN_1', teacherId: 'G01', subjectId: 'SEJ', classIds: ['X_TKP', 'X_DPIB', 'X_TKR_1', 'X_TKR_2'], totalHours: 2, splitPattern: [2] },
                { id: 'ASN_2', teacherId: 'G02', subjectId: 'PKKW', classIds: ['XII_DPIB', 'XII_TKJ_1'], totalHours: 8, splitPattern: [4, 4] },
                { id: 'ASN_3', teacherId: 'G03', subjectId: 'KJJ', classIds: ['XII_DPIB'], totalHours: 5, splitPattern: [3, 2] },
                { id: 'ASN_4', teacherId: 'G04', subjectId: 'EBKP', classIds: ['XII_DPIB'], totalHours: 5, splitPattern: [3, 2] }
            ],
            schedules: [],
            activeMatrixTheme: 'theme-classic',
            activeDisplayMode: 'code',
            activeSubjectTab: 'all',
            printMode: 'all',
            printSelectedId: 'all',
            printPaperSize: 'a4'
        };

        // Service Worker Dynamic Blob Injection for PWA
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('activate', e => self.clients.claim());
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        }

        // STREAMING_CHUNK:Defining UI helper and navigation handlers...
        window.toggleAuthModal = function() {
            const modal = document.getElementById('authModal');
            if (modal) modal.classList.toggle('hidden');
        };

        window.switchLoginTab = function(type) {
            const userTab = document.getElementById('tabUserBtn');
            const adminTab = document.getElementById('tabAdminBtn');
            const userForm = document.getElementById('userLoginForm');
            const adminForm = document.getElementById('adminLoginForm');

            if (type === 'user') {
                userTab.className = 'flex-1 py-2 rounded-lg bg-white shadow-sm text-brand-600 font-semibold text-xs';
                adminTab.className = 'flex-1 py-2 rounded-lg text-slate-500 hover:text-slate-700 font-semibold text-xs';
                userForm.classList.remove('hidden');
                adminForm.classList.add('hidden');
            } else {
                adminTab.className = 'flex-1 py-2 rounded-lg bg-white shadow-sm text-brand-600 font-semibold text-xs';
                userTab.className = 'flex-1 py-2 rounded-lg text-slate-500 hover:text-slate-700 font-semibold text-xs';
                adminForm.classList.remove('hidden');
                userForm.classList.add('hidden');
            }
        };

        window.handleUserLogin = function(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            state.currentUser = { name: username || 'Guru User', role: 'Guru / User' };
            updateUserUI();
            toggleAuthModal();
            showToast(`Selamat datang, ${username}!`, 'success');
        };

        window.handleAdminLogin = function(e) {
            e.preventDefault();
            state.currentUser = { name: 'Admin Kurikulum', role: 'Administrator' };
            updateUserUI();
            toggleAuthModal();
            showToast('Berhasil masuk sebagai Administrator!', 'success');
        };

        window.updateUserUI = function() {
            const userNameEl = document.getElementById('userName');
            const userRoleEl = document.getElementById('userRole');
            if (userNameEl) userNameEl.textContent = state.currentUser.name;
            if (userRoleEl) userRoleEl.textContent = state.currentUser.role;
        };

        window.showToast = function(msg, type = 'info') {
            const box = document.getElementById('toastBox');
            if (!box) return;
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-xl shadow-lg text-xs font-semibold text-white transition-all transform translate-y-2 ${type === 'success' ? 'bg-emerald-600' : 'bg-brand-600'}`;
            toast.innerHTML = `<i class="fa-solid fa-circle-info mr-2"></i>${msg}`;
            box.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        };

        window.navigateTo = function(viewId) {
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('bg-brand-50', 'text-brand-600');
                el.classList.add('text-slate-600');
            });
            const activeNav = document.getElementById(`nav-${viewId}`);
            if (activeNav) {
                activeNav.classList.add('bg-brand-50', 'text-brand-600');
                activeNav.classList.remove('text-slate-600');
            }

            const main = document.getElementById('mainContainer');
            if (!main) return;

            if (viewId === 'dashboard') renderDashboard(main);
            else if (viewId === 'competencies') renderCompetencies(main);
            else if (viewId === 'teachers') renderTeachers(main);
            else if (viewId === 'subjects') renderSubjects(main);
            else if (viewId === 'classes') renderClasses(main);
            else if (viewId === 'assignments') renderAssignments(main);
            else if (viewId === 'generator') renderGenerator(main);
            else if (viewId === 'matrix') renderMatrix(main);
            else if (viewId === 'print') renderPrint(main);
        };

        // STREAMING_CHUNK:Implementing Dashboard & Analytics views...
        function renderDashboard(container) {
            const teacherStats = state.teachers.map(t => {
                const teacherAsns = state.assignments.filter(a => a.teacherId === t.id);
                let totalJJM = 0;
                let rombelSet = new Set();
                teacherAsns.forEach(a => {
                    totalJJM += (a.totalHours * a.classIds.length);
                    a.classIds.forEach(c => rombelSet.add(c));
                });
                return { name: t.name, code: t.code, jjm: totalJJM, rombelCount: rombelSet.size };
            });

            const sortedJJM = [...teacherStats].sort((a,b) => b.jjm - a.jjm);
            const sortedRombel = [...teacherStats].sort((a,b) => b.rombelCount - a.rombelCount);

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="glass-panel p-5 rounded-2xl border border-slate-200/80">
                            <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Guru</div>
                            <div class="text-2xl font-black text-slate-800 mt-1">${state.teachers.length} Guru</div>
                        </div>
                        <div class="glass-panel p-5 rounded-2xl border border-slate-200/80">
                            <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Rombel</div>

        window.handleExcelMatrixFileSelected = function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    parseExcelMatrixData(rows);
                } catch(err) {
                    console.error('Excel Import Error:', err);
                    showToast('Gagal membaca file Excel. Pastikan format file sesuai.', 'info');
                }
            };
            reader.readAsArrayBuffer(file);
        };

        function parseExcelMatrixData(rows) {
            if (!rows || rows.length < 2) {
                showToast('File Excel kosong atau tidak valid.', 'info');
                return;
            }

            let headerRowIdx = -1;
            for (let i = 0; i < Math.min(10, rows.length); i++) {
                const rowStr = rows[i].join(' ').toLowerCase();
                if (rowStr.includes('teacher') || rowStr.includes('guru') || rowStr.includes('subject') || rowStr.includes('mapel')) {
                    headerRowIdx = i;
                    break;
                }
            }

            if (headerRowIdx === -1) headerRowIdx = 0;

            const headerRow = rows[headerRowIdx];
            
            let teacherCodeCol = -1;
            let teacherNameCol = -1;
            let subjectCol = -1;
            let splitCol = -1;

            for (let col = 0; col < headerRow.length; col++) {
                const val = String(headerRow[col] || '').trim().toLowerCase();
                if (val.includes('code') || val.includes('kode')) teacherCodeCol = col;
                else if (val.includes('teacher') || val.includes('nama guru') || val.includes('guru')) teacherNameCol = col;
                else if (val.includes('subject') || val.includes('mapel')) subjectCol = col;
                else if (val.includes('split')) splitCol = col;
            }

            if (teacherCodeCol === -1) teacherCodeCol = 0;
            if (teacherNameCol === -1) teacherNameCol = 1;
            if (subjectCol === -1) subjectCol = 2;
            if (splitCol === -1) splitCol = 3;

            const classStartCol = Math.max(teacherCodeCol, teacherNameCol, subjectCol, splitCol) + 2;

            const classHeaders = [];
            for (let col = classStartCol; col < headerRow.length; col++) {
                const classCode = String(headerRow[col] || '').trim();
                if (classCode) {
                    classHeaders.push({ colIdx: col, code: classCode });
                }
            }

            if (classHeaders.length === 0) {
                showToast('Tidak ditemukan kolom nama Rombel/Kelas pada file Excel.', 'info');
                return;
            }

            let teachersAdded = 0;
            let subjectsAdded = 0;
            let classesAdded = 0;
            let assignmentsAdded = 0;

            classHeaders.forEach(ch => {
                const cleanCode = ch.code.replace(/\s+/g, '-').toUpperCase();
                let existingCls = state.classes.find(c => c.code.toLowerCase() === cleanCode.toLowerCase() || c.code.toLowerCase() === ch.code.toLowerCase());
                if (!existingCls) {
                    const grade = cleanCode.startsWith('10') || cleanCode.startsWith('X-') || cleanCode.startsWith('X') ? 'X' : (cleanCode.startsWith('11') || cleanCode.startsWith('XI') ? 'XI' : 'XII');
                    const newClass = {
                        id: `CLS_${cleanCode}`,
                        code: ch.code,
                        name: `Kelas ${ch.code}`,
                        grade: grade,
                        maxWeeklyHours: grade === 'X' ? 50 : 48
                    };
                    state.classes.push(newClass);
                    classesAdded++;
                }
            });

            let currentTeacherCode = '';
            let currentTeacherName = '';

            for (let r = headerRowIdx + 1; r < rows.length; r++) {
                const row = rows[r];
                if (!row || row.length === 0) continue;

                let code = String(row[teacherCodeCol] || '').trim();
                let name = String(row[teacherNameCol] || '').trim();
                let subjectName = String(row[subjectCol] || '').trim();

                if (code) currentTeacherCode = code;
                if (name) currentTeacherName = name;

                if (!subjectName) continue;

                let teacherObj = state.teachers.find(t => t.code.toLowerCase() === currentTeacherCode.toLowerCase() || t.name.toLowerCase() === currentTeacherName.toLowerCase());
                if (!teacherObj && (currentTeacherCode || currentTeacherName)) {
                    teacherObj = {
                        id: `G_${Date.now()}_${r}`,
                        code: currentTeacherCode || `G-${state.teachers.length + 1}`,
                        name: currentTeacherName || currentTeacherCode,
                        nip: '',
                        picketDays: [],
                        maxHours: 32
                    };
                    state.teachers.push(teacherObj);
                    teachersAdded++;
                }

                let subjectObj = state.subjects.find(s => s.name.toLowerCase() === subjectName.toLowerCase() || s.code.toLowerCase() === subjectName.toLowerCase());
                if (!subjectObj) {
                    const subCode = subjectName.substring(0, 5).toUpperCase().replace(/\s+/g, '');
                    subjectObj = {
                        id: `SUB_${Date.now()}_${r}`,
                        code: subCode,
                        name: subjectName,
                        category: 'Kejuruan',
                        color: '#' + Math.floor(Math.random()*16777215).toString(16)
                    };
                    state.subjects.push(subjectObj);
                    subjectsAdded++;
                }

                const assignedClassIds = [];
                let totalJP = 0;

                classHeaders.forEach(ch => {
                    const jpVal = parseInt(row[ch.colIdx]);
                    if (!isNaN(jpVal) && jpVal > 0) {
                        const targetCls = state.classes.find(c => c.code.toLowerCase() === ch.code.toLowerCase());
                        if (targetCls) {
                            assignedClassIds.push(targetCls.id);
                            totalJP = Math.max(totalJP, jpVal);
                        }
                    }
                });

                if (assignedClassIds.length > 0 && teacherObj && subjectObj) {
                    let splitPattern = [totalJP];
                    if (totalJP === 2) splitPattern = [2];
                    else if (totalJP === 3) splitPattern = [2, 1];
                    else if (totalJP === 4) splitPattern = [2, 2];
                    else if (totalJP === 5) splitPattern = [3, 2];
                    else if (totalJP === 6) splitPattern = [3, 3];
                    else if (totalJP > 6) splitPattern = [4, totalJP - 4];

                    state.assignments.push({
                        id: `ASN_EXCEL_${Date.now()}_${r}`,
                        teacherId: teacherObj.id,
                        subjectId: subjectObj.id,
                        classIds: assignedClassIds,
                        totalHours: totalJP,
                        splitPattern: splitPattern
                    });
                    assignmentsAdded++;
                }
            }

            navigateTo('assignments');
            showToast(`Import Matrix Excel Berhasil! +${assignmentsAdded} Penugasan, +${teachersAdded} Guru, +${subjectsAdded} Mapel.`, 'success');
        }

        window.quickAssignAllGrade = function(grade) {
            const teacherId = document.getElementById('asgnTeacher').value;
            const subjectId = document.getElementById('asgnSubject').value;
            const totalHours = parseInt(document.getElementById('asgnHours').value) || 4;
            const splitInput = document.getElementById('asgnSplit').value || '2,2';

            if (!teacherId || !subjectId) {
                showToast('Pilih Guru dan Mapel terlebih dahulu!', 'info');
                return;
            }

            const targetClasses = state.classes.filter(c => grade === 'X' ? c.grade === 'X' : (c.grade === 'XI' || c.grade === 'XII')).map(c => c.id);
            const splitPattern = splitInput.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n));

            state.assignments.push({
                id: `ASN_${Date.now()}`,
                teacherId,
                subjectId,
                classIds: targetClasses,
                totalHours,
                splitPattern
            });

            navigateTo('assignments');
            showToast(`Penugasan Massal Tingkat ${grade} Berhasil!`, 'success');
        };

        window.generateSchedulesAuto = function() {
            state.schedules = [];
            state.assignments.forEach(asn => {
                asn.classIds.forEach(classId => {
                    let patternIndex = 0;
                    DAYS.forEach(day => {
                        const teacher = state.teachers.find(t => t.id === asn.teacherId);
                        if (teacher && teacher.picketDays.includes(day)) return;

                        for (let p = 1; p <= PERIODS_PER_DAY; p++) {
                            if (p === BREAK_PERIOD) continue;
                            
                            const chunk = asn.splitPattern[patternIndex] || 2;
                            const occupied = state.schedules.some(s => s.day === day && s.period === p && (s.classId === classId || s.teacherId === asn.teacherId));

                            if (!occupied && patternIndex < asn.splitPattern.length) {
                                for (let k = 0; k < chunk; k++) {
                                    if (p + k <= PERIODS_PER_DAY && (p + k) !== BREAK_PERIOD) {
                                        state.schedules.push({
                                            day,
                                            period: p + k,
                                            classId,
                                            subjectId: asn.subjectId,
                                            teacherId: asn.teacherId
                                        });
                                    }
                                }
                                patternIndex++;
                                p += (chunk - 1);
                            }
                        }
                    });
                });
            });

            navigateTo('generator');
            showToast('Auto-Generate Jadwal Bebas Bentrok Selesai!', 'success');
        };
